<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  23. Sept.: Hier stand nur <dir>/app</dir>. Im Ordner fonts/ lagen aber ausschliesslich
  .woff2-Dateien - und die liest fontconfig NICHT. Damit war im Container keine einzige der
  Schriften vorhanden, die der Code bestellt (Poppins, DejaVu Sans Condensed, TeX Gyre Bonum),
  und jeder Name auf jedem Shirt wurde in irgendeiner Ersatzschrift gesetzt. Markus:
  "Wir haben auch das Problem mit dem Namen und dem Design von vorne bei Abi noch nicht
  wirklich fertig oder so, dass es ordentlich aussieht." Das war der Grund.

  Jetzt liegen die echten .ttf-Dateien in fonts/. Die Systemschriften bleiben zusaetzlich
  bekannt: ohne sie gaebe es gar keine Ersatzschrift mehr, und ein fehlendes Zeichen waere
  ein leeres Kaestchen statt eines Buchstabens.
-->
<fontconfig>
  <dir>/app/fonts</dir>
  <dir>/app</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/fontcache</cachedir>
  <config></config>
</fontconfig>
