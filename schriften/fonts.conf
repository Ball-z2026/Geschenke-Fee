<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Macht die Schriften aus diesem Ordner bekannt, ohne sie zu installieren.
     server.js setzt FONTCONFIG_FILE auf diese Datei, bevor sharp etwas zeichnet. -->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.fccache</cachedir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
